name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      OS: linux
      ARCH: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Package release binary
        run: |
          set -euo pipefail
          test -f build/water
          mkdir -p dist
          cp build/water "dist/water-${TAG}-${OS}-${ARCH}"
          chmod +x "dist/water-${TAG}-${OS}-${ARCH}"

      - name: Create or update GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: dist/water-${{ env.TAG }}-${{ env.OS }}-${{ env.ARCH }}
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true
